<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог настільних ігор</title>
    <link rel="stylesheet" href="css/boardgame-catalog.css">
</head>
<body>
<!--Шапка з навігацією та пошуком-->
    <header class="header">
        <h1 class="header_title">Каталог настільних ігор</h1>
        <nav class="header_nav">
            <a class="header_nav_a" href="#strategy-games">Стратегії</a>
            <a class="header_nav_a" href="#fantasy-games">Фентезі</a>
        </nav>
    </header>

    <main class="main">
        <!--Блок фільтрів-->
        <section class="filters">
            <h2 class="filter_title">Фільтри</h2>
            <form action="#" method="GET">
                <label for="filter_genre">Введіть жанр гри:</label>
                <input type="text" name="filter_genre" id="filter_genre" placeholder="Приклад:Фентезі">
            </form>
        </section>
        <!--Cписок карток ігор-->
        <section id="strategy-games" class="category_section">
            <h2>Стратегії</h2>
            <div class="game_grid">
                <article class="game_card">
                    <h3>Настільна гра "Фростпанк"</h3>
                    <img src="assets/img/FrostPunkBoardGame.jpg" alt="Обкладинка настільної гри 'Фростпанк'">
                </article>
                <article class="game_card">
                    <h3>Тераформування "Марса"</h3>
                    <img src="assets/img/TerraformingMars.jpg" alt="Обкладинка настільної гри 'Тераформування Марса'">
                </article>
            </div>
        </section>
        <section id="fantasy-games" class="category_section">
            <h2>Фентезі</h2>
            <div class="game_grid">
                <article class="game_card">
                    <h3>Настільна гра "Коса"</h3>
                    <img src="assets/img/KosaBoardGame.jpg" alt="Обкладинка настільної гри 'Коса: Піднесення Фенріса'">
                </article>
                <article class="game_card">
                    <h3>Настільна гра "Володар Перснів"</h3>
                    <img src="assets/img/LotR.jpg" alt="Обкладинка настільної гри 'Володар Перснів'">
                </article>
            </div>
        </section>
    </main>
<!--Підвал-->
    <footer class="footer">
        <p>Погорілий Олександр Олександрович ІП-53</p>
    </footer>

    <script src="js/boardgame-catalog.js"></script>
</body>
</html>
